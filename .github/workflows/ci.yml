name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke-test package imports
        run: pnpm smoke:packages

      - name: Validate package exports
        run: |
          pnpm dlx publint packages/tokens
          pnpm dlx publint packages/react
          pnpm dlx @arethetypeswrong/cli --pack packages/tokens --profile node16 --entrypoints .
          pnpm dlx @arethetypeswrong/cli --pack packages/react --profile node16 --entrypoints . ./components/core ./components/data ./components/feedback ./components/forms ./components/navigation ./components/product

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Theme e2e (JS-disabled prefers-color-scheme contract)
        run: pnpm test:e2e

      - name: Lint
        run: pnpm lint

      - name: Validate Figma plugin
        run: pnpm --filter bridger-figma-plugin run validate

      - name: Run Figma plugin e2e
        run: pnpm --filter bridger-figma-plugin run e2e
