name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # components/ and tokens/ are generated mirrors of packages/. Regenerate
      # and fail if the committed output drifts from the canonical sources.
      - name: Verify generated mirror is in sync
        run: |
          pnpm generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::components/ and tokens/ are generated — edit packages/ sources, run 'pnpm generate', and commit the result."
            git status --porcelain
            git diff --exit-code
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Validate Figma plugin
        run: pnpm --filter bridger-figma-plugin run validate

      - name: Run Figma plugin e2e
        run: pnpm --filter bridger-figma-plugin run e2e
