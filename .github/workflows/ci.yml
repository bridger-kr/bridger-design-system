name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # components/ and tokens/ are generated mirrors of packages/. Regenerate
      # and fail if the committed output drifts from the canonical sources.
      - name: Verify generated mirror is in sync
        run: |
          pnpm generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::components/ and tokens/ are generated — edit packages/ sources, run 'pnpm generate', and commit the result."
            git status --porcelain
            git diff --exit-code
            exit 1
          fi

      # The mirror must resolve as a standalone consumer surface: every
      # relative specifier resolves on disk, every bare specifier is declared
      # in root dependencies, and esbuild bundles it with declared-only
      # externals (workspace hoisting cannot mask a missing dep).
      - name: Verify generated mirror resolves
        run: pnpm verify:mirror

      - name: Build
        run: pnpm build

      - name: Smoke-test package imports
        run: pnpm smoke:packages

      - name: Validate package exports
        run: |
          pnpm dlx publint packages/tokens
          pnpm dlx publint packages/react
          pnpm dlx @arethetypeswrong/cli --pack packages/tokens --profile node16 --entrypoints .
          pnpm dlx @arethetypeswrong/cli --pack packages/react --profile node16 --entrypoints . ./components/core ./components/data ./components/feedback ./components/forms ./components/navigation ./components/product

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The release-gate matrix drives the built component harness.
      - name: Build component harness example
        run: pnpm build:example:primitives

      - name: E2E (theme contract + release matrix)
        run: pnpm test:e2e

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-matrix-${{ github.sha }}
          path: test-results/
          retention-days: 14

      - name: Lint
        run: pnpm lint

      - name: Slop scan (examples + figma-plugin)
        run: pnpm check:slop

      - name: Validate Figma plugin
        run: pnpm --filter bridger-figma-plugin run validate

      - name: Run Figma plugin e2e
        run: pnpm --filter bridger-figma-plugin run e2e
