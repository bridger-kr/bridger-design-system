name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # npm auth is only required when this run actually publishes (i.e. a
      # Version Packages PR just merged). It must not block version-PR
      # creation, so a missing or expired token degrades to a warning here and
      # surfaces as a failure only in the publish step below.
      - name: Configure npm authentication
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not configured for this repository. Version PRs can still be created, but npm publish will fail until the secret is added."
            exit 0
          fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          mkdir -p "$(dirname "$npmrc")"
          printf "//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n" > "$npmrc"
          if ! npm whoami >/dev/null 2>&1; then
            echo "::warning::NPM_TOKEN is set but npm rejected it (whoami failed). Rotate the secret; npm publish will fail until then."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure npm packages are public
        if: steps.changesets.outputs.published == 'true'
        run: |
          packages=(
            "@bridger-kr/tokens"
            "@bridger-kr/react"
          )

          for package_name in "${packages[@]}"; do
            npm access set status=public "$package_name"
            npm view "$package_name" version --registry=https://registry.npmjs.org/
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
