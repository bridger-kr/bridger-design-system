<!-- @dsCard group="Colors" viewport="700x190" name="Persimmon primary" subtitle="One orange action color — fill-only; text uses accent-text (AA)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--dt-bg); padding: 22px; display: flex; gap: 16px; align-items: stretch; }
  .big { flex: 1; border-radius: var(--dt-radius-lg); background: var(--dt-accent); color: var(--dt-accent-ink); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .big .name { font-weight: 600; font-size: 16px; }
  .big .hex { font-family: var(--dt-font-mono); font-size: 13px; opacity: 0.85; }
  .side { width: 260px; display: grid; gap: 10px; }
  .s { border-radius: var(--dt-radius-md); border: 1px solid var(--dt-border); background: var(--dt-surface); padding: 9px 12px; display: flex; align-items: center; gap: 10px; font-family: var(--dt-font-mono); font-size: 12px; color: var(--dt-text-muted); }
  .dot { width: 20px; height: 20px; border-radius: 6px; flex: 0 0 auto; }
  .as-text { color: var(--dt-accent-text); font-weight: 600; }
</style>
</head>
<body>
  <div class="big">
    <div class="name">accent · persimmon · fill only</div>
    <div class="hex">#ec5e1f</div>
  </div>
  <div class="side">
    <div class="s"><span class="dot" style="background:var(--dt-accent-text)"></span> <span class="as-text">accent-text · #b83c0d · text role</span></div>
    <div class="s"><span class="dot" style="background:var(--dt-accent-strong)"></span> accent-strong · #93390c · hover/press</div>
    <div class="s"><span class="dot" style="background:var(--dt-accent-bright)"></span> accent-bright · #ff6f2e</div>
    <div class="s"><span class="dot" style="background:var(--dt-accent-soft)"></span> accent-soft · 14% tint</div>
  </div>
</body>
</html>
