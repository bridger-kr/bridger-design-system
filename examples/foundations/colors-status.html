<!-- @dsCard group="Colors" viewport="700x160" name="Status hues" subtitle="Semantic only — success / warning / danger / info (cobalt); same hue in both themes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--dt-surface); padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { display: grid; gap: 8px; }
  .chip { height: 44px; border-radius: var(--dt-radius-md); box-shadow: var(--dt-ring); }
  .lab { font-family: var(--dt-font-mono); font-size: 11px; color: var(--dt-text-muted); }
  .lab b { display: block; color: var(--dt-text-strong); font-weight: 600; font-size: 12px; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="chip" style="background:var(--dt-success)"></div><div class="lab"><b>success</b>#0d7233</div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-warning)"></div><div class="lab"><b>warning · amber</b>#785800</div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-danger)"></div><div class="lab"><b>danger</b>#b91c1c</div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-cobalt)"></div><div class="lab"><b>info · cobalt</b>#1d4ed8</div></div>
  </div>
</body>
</html>
