<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="chip 6 · control 10 · card 14 · pill — semantic roles only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--dt-paper); padding: 26px; font-family: var(--dt-font-sans); }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .item { display: grid; gap: 10px; justify-items: center; }
  .box { width: 80px; height: 60px; background: var(--dt-surface); border: 1px solid var(--dt-border-strong); }
  .lab { font-family: var(--dt-font-mono); font-size: 11px; color: var(--dt-muted); }
  .lab b { color: var(--dt-ink-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--dt-radius-chip)"></div><div class="lab"><b>chip</b> 6</div></div>
    <div class="item"><div class="box" style="border-radius:var(--dt-radius-control)"></div><div class="lab"><b>control</b> 10</div></div>
    <div class="item"><div class="box" style="border-radius:var(--dt-radius-card)"></div><div class="lab"><b>card</b> 14</div></div>
    <div class="item"><div class="box" style="width:60px; border-radius:var(--dt-radius-pill)"></div><div class="lab"><b>pill</b> full</div></div>
  </div>
</body>
</html>
