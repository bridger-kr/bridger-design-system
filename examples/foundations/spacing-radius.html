<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="4 sm · 6 md · 8 lg · pill — crisp, hairline-defined" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--dt-bg); padding: 26px; font-family: var(--dt-font-sans); }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .item { display: grid; gap: 10px; justify-items: center; }
  .box { width: 80px; height: 60px; background: var(--dt-surface); border: 1px solid var(--dt-border-strong); }
  .lab { font-family: var(--dt-font-mono); font-size: 12px; color: var(--dt-text-muted); }
  .lab b { color: var(--dt-text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--dt-radius-sm)"></div><div class="lab"><b>sm</b> 4</div></div>
    <div class="item"><div class="box" style="border-radius:var(--dt-radius-md)"></div><div class="lab"><b>md</b> 6</div></div>
    <div class="item"><div class="box" style="border-radius:var(--dt-radius-lg)"></div><div class="lab"><b>lg</b> 8</div></div>
    <div class="item"><div class="box" style="width:110px; height:34px; border-radius:var(--dt-radius-pill)"></div><div class="lab"><b>pill</b> badges</div></div>
  </div>
</body>
</html>
