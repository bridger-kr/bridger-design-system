<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation" subtitle="Structure from hairlines — one shadow, only for layers that float" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--dt-bg); padding: 30px 28px; font-family: var(--dt-font-sans); }
  .row { display: flex; gap: 24px; align-items: flex-start; justify-content: space-between; }
  .item { display: grid; gap: 12px; justify-items: center; }
  .box { width: 104px; height: 66px; background: var(--dt-surface); border-radius: var(--dt-radius-md); }
  .lab { text-align: center; }
  .lab b { font-family: var(--dt-font-mono); font-size: 12px; color: var(--dt-text-strong); font-weight: 600; }
  .lab span { display: block; font-size: 12px; color: var(--dt-text-muted); margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border:1px solid var(--dt-border)"></div><div class="lab"><b>plane</b><span>1px border</span></div></div>
    <div class="item"><div class="box" style="border:1px solid var(--dt-border-strong)"></div><div class="lab"><b>emphasis</b><span>stronger hairline</span></div></div>
    <div class="item"><div class="box" style="border:1px solid var(--dt-border); box-shadow:var(--dt-shadow-overlay)"></div><div class="lab"><b>overlay</b><span>menu / dialog</span></div></div>
  </div>
</body>
</html>
