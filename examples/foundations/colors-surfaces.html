<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces" subtitle="Achromatic neutral planes — structure reads from hairlines, not float" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--dt-bg); padding: 24px; font-family: var(--dt-font-sans); }
  .sheet { border: 1px solid var(--dt-border-strong); display: grid; grid-template-columns: repeat(5, 1fr); }
  .cell { border-right: 1px solid var(--dt-border); }
  .cell:last-child { border-right: 0; }
  .chip { height: 56px; border-bottom: 1px solid var(--dt-border); }
  .meta { padding: 10px 12px; }
  .meta .role { font-family: var(--dt-font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dt-text-muted); }
  .meta .name { font-size: 13px; font-weight: 650; color: var(--dt-text-strong); margin-top: 3px; }
  .meta .hex { font-family: var(--dt-font-mono); font-size: 11px; color: var(--dt-text-subtle); margin-top: 2px; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="cell"><div class="chip" style="background:var(--dt-bg)"></div><div class="meta"><div class="role">page</div><div class="name">bg</div><div class="hex">#ffffff</div></div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-surface)"></div><div class="meta"><div class="role">card</div><div class="name">surface</div><div class="hex">oklch .9875 ≈ #fbfbfb</div></div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-surface-raised)"></div><div class="meta"><div class="role">raised</div><div class="name">surface-raised</div><div class="hex">#ffffff</div></div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-surface-muted)"></div><div class="meta"><div class="role">muted wash</div><div class="name">surface-muted</div><div class="hex">oklch .975 ≈ #f7f7f7</div></div></div>
    <div class="cell"><div class="chip" style="background:var(--dt-surface-sunken)"></div><div class="meta"><div class="role">well / inset</div><div class="name">surface-sunken</div><div class="hex">oklch .97 ≈ #f5f5f5</div></div></div>
  </div>
</body>
</html>
